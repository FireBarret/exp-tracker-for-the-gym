{% extends "base.html" %}
{% block title %}Pick a user — Gym Log{% endblock %}
{% block content %}

<h1>Who's lifting?</h1>
<div class="grid">
  {% for user in users %}
    <a class="btn tile" href="{{ url_for('select_user', user_id=user.id) }}">{{ user.name }}</a>
  {% endfor %}
</div>

{% endblock %}
