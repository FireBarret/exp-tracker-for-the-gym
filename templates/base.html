<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Gym Log{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">🏋️ Gym Log</a>
    {% if session.get('user_id') %}
      <nav class="topnav">
        <span class="who">{{ session.get('user_name') }}</span>
        {% if active_session %}
          <a class="resume-pill" href="{{ url_for('session_log', session_id=active_session.id) }}">
            ● Resume {{ active_session.split_name }}
          </a>
        {% endif %}
        <a href="{{ url_for('splits') }}">Splits</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('progress') }}">Progress</a>
        <a href="{{ url_for('home') }}">Switch</a>
      </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
